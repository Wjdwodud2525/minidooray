<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 페이지를 찾을 수 없습니다</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main>
    <p class="status" th:text="${status} ?: 404">404</p>
    <h1 th:text="${title} ?: '페이지를 찾을 수 없습니다'">페이지를 찾을 수 없습니다</h1>
    <p th:text="${message} ?: '요청한 대상을 찾을 수 없습니다.'">요청한 대상을 찾을 수 없습니다.</p>
    <nav>
        <a th:href="@{/projects}">프로젝트로 이동</a>
        <a class="secondary" th:href="@{/}">처음으로</a>
    </nav>
</main>
</body>
</html>
