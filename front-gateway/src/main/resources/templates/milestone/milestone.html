<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${milestone.name}">마일스톤 상세</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main>
    <header>
        <h1 th:text="${milestone.name}">마일스톤</h1>
        <nav><a th:href="@{/projects/{projectId}/milestones(projectId=${projectId})}">마일스톤 목록</a></nav>
    </header>
    <section class="panel">
        <p>ID <span th:text="${milestone.milestoneId}">1</span></p>
        <p>상태 <span th:text="${milestone.status}">OPEN</span></p>
        <form method="post" th:action="@{/projects/{projectId}/milestones/{milestoneId}(projectId=${projectId}, milestoneId=${milestone.milestoneId})}">
            <input name="name" type="text" th:value="${milestone.name}" required>
            <select name="status" required>
                <option value="OPEN" th:selected="${milestone.status != null and milestone.status.name() == 'OPEN'}">OPEN</option>
                <option value="IN_PROGRESS" th:selected="${milestone.status != null and milestone.status.name() == 'IN_PROGRESS'}">IN_PROGRESS</option>
                <option value="CLOSED" th:selected="${milestone.status != null and milestone.status.name() == 'CLOSED'}">CLOSED</option>
            </select>
            <button type="submit">수정</button>
        </form>
        <form method="post" th:action="@{/projects/{projectId}/milestones/{milestoneId}(projectId=${projectId},milestoneId=${milestone.milestoneId})}">
            <input type="hidden" name="_method" value="delete">
            <button class="danger" type="submit">삭제</button>
        </form>
    </section>
</main>
</body>
</html>
